; Ioniq 6 OBD-Anzeige fuer das Waveshare ESP32-S3-Touch-LCD-4.3 (800x480 RGB,
; GT911-Touch, 16 MB Flash, 8 MB PSRAM). Dient der CI als Compile-Test; die
; Release-Bins baut arduino-cli (siehe README).
; Seit FW 57 Arduino-Core 3.1.3 (pioarduino) wegen des Bounce-Buffers.
[platformio]
src_dir = ioniq6_display

[env:ws43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Wl,--wrap=esp_brownout_init
    -Wl,--wrap=spi_flash_disable_interrupts_caches_and_other_cpu
    -Wl,--wrap=spi_flash_enable_interrupts_caches_and_other_cpu
lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    h2zero/NimBLE-Arduino@1.4.3
    olikraus/U8g2@2.35.30
